name: review

# Called from each repository's pull_request workflow (see README). Kept in one place so a
# withdrawn free model, the opencode action or the prompt is changed once, not per repository.
on:
  workflow_call:
    inputs:
      model:
        description: opencode model, provider/id
        type: string
        # Zen free tier, not used for training and kept 0 days (opencode docs, 2026-10-21).
        # Free models are withdrawn without notice; that shows as this job failing.
        default: opencode/glm-5.3-flash-free
    secrets:
      # Not required: fork and Dependabot runs pass it empty, and the job's if skips them.
      # Whether a required secret passed empty fails the call first is not verified.
      OPENCODE_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  review:
    # Fork PRs get no secrets, so the run could only fail. pull_request_target is not used
    # because it would hand the secret to code from the fork. A run started by Dependabot
    # gets no Actions secrets either, and opencode refuses any bot actor (its permission check
    # is for collaborators); a person pushing to a bot's PR still gets a review. pull_request only:
    # a pull_request_target caller would run this with the secret on a fork's PR.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A push makes the review of the previous head pointless. Each run still posts its own
    # comment; nothing edits an earlier one.
    concurrency:
      group: opencode-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      # Commenting on a PR number through the issues API was refused with 403 under
      # issues: write alone (akapen run 40163784587); the reaction opencode adds needs issues.
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base below needs the history of both sides.
          fetch-depth: 0
          # The review pushes nothing, so the token has no reason to sit in .git/config.
          persist-credentials: false
      # opencode re-fetches the PR branch with --depth=max(commits, 20), which makes the clone
      # shallow and cuts the merge base off a PR of 20 commits or more. Find it while the
      # history is still whole; a two-dot diff then needs only the two commits. The end is the
      # event's head, not HEAD, so a force push between the event and the job does not drag
      # unrelated commits into the diff. checkout fetches the event's merge commit, whose
      # parent is that head, so the head is always there.
      - name: Write the PR's diff outside the worktree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Assigned first so a failing merge-base stops the step instead of writing an empty diff.
        run: |
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          mkdir -p "$RUNNER_TEMP/opencode-review"
          git diff "$merge_base" "$HEAD_SHA" > "$RUNNER_TEMP/opencode-review/pr.diff"
      # shortcut: the action installs whatever opencode release is latest, so the binary is
      # not pinned, and opencode fetches the PR branch anonymously, which only a public
      # repository allows. Pin it and give the fetch credentials before a private one calls this.
      - uses: anomalyco/opencode/github@148842ef7cb1bc34192b3fff57d0f9721ab9c801 # v1.19.4
        env:
          # Zen with no balance and no auto-recharge: a leaked key reaches the free models only.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # The action's agent input is not read at v1.19.4, so the agent comes from config.
          # Without it the build agent may edit files, and the dirty tree turns the run into
          # a push that contents: read refuses, losing the review. No shell at all: an allowed
          # git command could still write through a redirect or an abbreviated --output, and a
          # written .git/config runs commands. The diff is read from a file written above,
          # outside the worktree; the last matching rule wins, so that one directory is
          # allowed after everything outside the worktree is denied.
          # The PR's own opencode.json and .opencode/ (agents, plugins, tools) would otherwise load
          # from the checked-out tree, override the permissions below and run code.
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
          OPENCODE_CONFIG_CONTENT: >-
            {"default_agent": "plan", "share": "disabled", "permission": {"edit": "deny",
            "bash": "deny", "webfetch": "deny", "websearch": "deny", "external_directory":
            {"*": "deny", "${{ runner.temp }}/opencode-review/*": "allow"}}}
        with:
          model: ${{ inputs.model }}
          use_github_token: true
          prompt: |
            このプルリクエストをレビューし、結果を日本語で 1 件のコメントにまとめてください。
            - 変更の diff は `${{ runner.temp }}/opencode-review/pr.diff` にある。まずそれを読み、周りのコードはリポジトリのファイルを読んで確かめる
            - 既存のコメントやレビューの指摘は繰り返さず、変更そのものを独立に見る
            - ファイルを編集しない。コマンドは使えない
            - 見るのはバグ、壊れうる入力・順序、テストが押さえていない挙動、セキュリティ
            - 書式や好みの指摘は書かない
            - 指摘ごとにファイルと行、何が起きるか、直し方を書く
            - 指摘が無ければ「指摘なし」とだけ書く

      # The session (prompts, replies, tool calls, the model's reasoning when it gives any) and
      # opencode's own log are what tuning the prompt needs, and they are gone with the runner
      # otherwise. Artifacts of a public repository can be downloaded by anyone signed in, so the
      # bundle is checked for the key and the token and dropped if it holds either.
      - name: Collect opencode's session and log
        id: collect
        if: always()
        env:
          API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN_IN: ${{ github.token }}
          # opencode runs here in the PR's worktree too; without this a plugin in the PR's
          # .opencode/ would load and run.
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
        run: |
          out="$RUNNER_TEMP/opencode-review/logs"
          mkdir -p "$out"
          command -v opencode >/dev/null || { echo "::warning::opencode was not installed; nothing to collect"; exit 0; }
          # Assigned first so a failing list or jq stops the step instead of collecting nothing.
          sessions=$(env -u API_KEY -u GH_TOKEN_IN opencode session list --format json)
          ids=$(jq -r '.[].id' <<< "$sessions")
          # session list returns root sessions only; a subagent the model starts through the task
          # tool runs in a child session, named in that tool call's metadata. The model picks that
          # id and may name a session already exported, so each id is exported once.
          declare -A seen
          while [ -n "$ids" ]; do
            next=""
            for id in $ids; do
              [ -n "${seen[$id]:-}" ] && continue
              seen[$id]=1
              file="$out/session-$id.json"
              env -u API_KEY -u GH_TOKEN_IN opencode export "$id" > "$file" || { echo "::warning::export of $id failed"; continue; }
              children=$(jq -r '.messages[].parts[] | select(.type == "tool" and .tool == "task") | .state.metadata.sessionId // empty' "$file")
              next="$next $children"
            done
            ids=$(xargs <<< "$next")
          done
          log_dir="${XDG_DATA_HOME:-$HOME/.local/share}/opencode/log"
          [ -d "$log_dir" ] && cp -r "$log_dir" "$out/log"
          # The key is not required, and an empty pattern would match every line.
          patterns=(-e "$GH_TOKEN_IN")
          [ -n "$API_KEY" ] && patterns+=(-e "$API_KEY")
          # 0 is a match and 1 no match; anything else means the check did not run, so it is
          # treated as a match rather than letting the bundle through unchecked.
          # -R follows symlinks, which upload-artifact also follows; cp -r copies them as links.
          rc=0; grep -RqF "${patterns[@]}" "$out" || rc=$?
          if [ "$rc" != 1 ]; then
            rm -rf "$out"
            echo "::error::The collected logs contain the API key or the GitHub token, or could not be checked (grep exit $rc); they were deleted, not uploaded."
            exit 1
          fi

      # Only after the collect step finished: a failure before its key check (a failed list or
      # copy; a failed export only warns, and its file is still checked) would otherwise upload
      # files nobody checked.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.collect.outcome == 'success'
        with:
          name: opencode-review-logs
          path: ${{ runner.temp }}/opencode-review/logs
          if-no-files-found: ignore
          # Two weeks of reviews to compare prompt changes against; the bundle was 34 KB zipped
          # for a 47-line diff and grows with the files the model reads.
          retention-days: 14
