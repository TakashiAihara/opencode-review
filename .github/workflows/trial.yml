name: trial-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [trial-q/base]

permissions:
  contents: read

jobs:
  opencode:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: TakashiAihara/opencode-review/.github/workflows/review.yml@main
    with:
      model: opencode/${{ github.head_ref }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
